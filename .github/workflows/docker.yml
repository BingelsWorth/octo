name: Docker Build & Push

on:
  workflow_dispatch:
  push:
    # Dated releases (2026.07.29) as well as any future v-prefixed ones. Without the
    # second pattern a dated tag pushes silently and never builds an image.
    tags: ['v*', '[0-9][0-9][0-9][0-9].*']
    branches: [main]
  # No pull_request trigger. A merge already arrives here as a push to main, so
  # building on `closed` too meant every merge built the same commit twice.

# Serialise image builds. Concurrent runs export to the same GitHub Actions cache
# and collide with "failed to reserve cache". Queue rather than cancel: a half
# published image is worse than a slow one, and tagging a release legitimately
# overlaps with the merge that preceded it.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: "9.0.x"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal

  docker:
    needs: build-and-test
    runs-on: ubuntu-latest
    # No `if` needed: the only triggers left are push and workflow_dispatch, both of
    # which should publish. The old condition also allowed merged pull_request events,
    # which no longer reach this workflow.

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            # Tags the image with the release name verbatim, e.g. 2026.07.29. The semver
            # patterns below cannot match a dated tag (07 is not valid semver), so this
            # is what actually labels a release build.
            type=ref,event=tag
            type=sha,prefix=
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # Was gated on refs/heads/dev, a branch this repo does not have, so `latest`
            # was never published at all and `docker pull ...:latest` failed for everyone.
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
